<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>曲谱同步导聆</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#20342f;background:#edf1ed}*{box-sizing:border-box}body{margin:0}header{padding:22px 30px;background:#173d34;color:#fff}h1{font-size:23px;margin:0 0 8px}header p{margin:0;color:#c8dbd0;font-size:13px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:15px 25px;background:#fff;border-bottom:1px solid #d5ded7;position:sticky;top:0;z-index:3}button,input,select{font:inherit;border:1px solid #bbc9be;border-radius:7px;padding:8px;background:#fff;color:#20342f}button{cursor:pointer}button:hover{background:#edf4ee}button.primary{background:#205b48;color:#fff}input[type=number]{width:80px}audio{height:34px;flex:1;min-width:250px}.layout{display:grid;grid-template-columns:150px minmax(0,1fr) 360px;gap:18px;padding:18px;align-items:start}aside{background:#fff;border-radius:10px;padding:16px;position:sticky;top:88px}h2{font-size:16px;margin:0 0 12px}.list{max-height:calc(100vh - 220px);overflow:auto;display:grid;gap:4px}.list button{text-align:left;font-size:12px}.list button.active{background:#205b48;color:white}.list button.flag:before{content:'· ';color:#c17b28;font-weight:bold}.sheet{position:relative;background:white;box-shadow:0 3px 15px #173d3417;min-height:400px}.sheet img{width:100%;display:block}.highlight{position:absolute;border:2px solid #bd7c19;background:#e9b54229;pointer-events:none}.playhead{position:absolute;top:0;bottom:0;width:2px;background:#d63a42;box-shadow:0 0 0 1px #ffffffb0,0 0 7px #d63a4255;pointer-events:none;z-index:2;transform:translateX(-50%)}.playhead::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #d63a42}.playhead-readout{font-size:12px;color:#a13239;white-space:nowrap}.pagebuttons{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:10px}.status{font-size:12px;padding:5px 8px;background:#fff4d7;border-radius:5px;display:inline-block}dl{font-size:13px}dt{color:#6a7e70;margin-top:13px}dd{margin:4px 0;line-height:1.6}small{font-size:11px;color:#6a7e70;line-height:1.7}#reason{width:100%;margin:10px 0}.side button{width:100%;margin-bottom:8px}#notice{font-size:12px;line-height:1.7;white-space:pre-wrap;color:#7f5117}.side p{font-size:12px;line-height:1.8}.muted{color:#6a7e70}.sheet a{display:block;padding:20px}#toast{min-height:20px;color:#205b48;font-size:12px}a{color:#205b48}
.side{top:calc(var(--toolbar-height,70px) + 12px);max-height:calc(100dvh - var(--toolbar-height,70px) - 36px);overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.now-playing{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.now-playing h2{margin:0;font-size:14px}.now-playing .status{font-size:10px}
.analysis-tabs{display:flex;border-bottom:1px solid #d7e2d9;gap:3px}.side .analysis-tabs button{width:auto;flex:1;margin:0;border:0;border-radius:6px 6px 0 0;font-size:13px;padding:10px 4px;color:#63766b}.analysis-tabs button[aria-selected=true]{background:#e4efe8;color:#174b39;font-weight:700}
.side .analysis-note{font-size:11px;color:#738176;line-height:1.7;overflow-wrap:anywhere;margin:12px 0}.guide-playing-page{font-size:12px;color:#205b48;font-weight:600}.guide-range{font-size:11px;color:#7e8c80}.side h3{font-size:16px;line-height:1.6;margin:10px 0}.guide-select-label{display:block;font-size:11px;color:#6a7e70;margin:12px 0}.guide-select-label select{display:block;max-width:100%;width:100%;margin:5px 0;font-size:12px}
.analysis-rich{font-size:13px;line-height:1.9;overflow-wrap:anywhere}.side .analysis-rich p{font-size:13px;line-height:1.9}.analysis-rich ul,.analysis-rich ol{padding-left:19px}.analysis-rich code{background:#f0f4ef;border-radius:3px;padding:1px 3px;font-size:11px}.analysis-rich pre{white-space:pre-wrap;padding:8px;background:#f0f4ef}.analysis-rich h1,.analysis-rich h2{font-size:17px;line-height:1.6}.analysis-rich h3{font-size:15px}.analysis-rich blockquote{border-left:3px solid #d7e2d9;margin:12px 0;padding-left:10px;color:#68796d}.analysis-rich table{font-size:11px;border-collapse:collapse}.analysis-rich td,.analysis-rich th{border:1px solid #d7e2d9;padding:4px}
.full-analysis,.review-tools{border-top:1px solid #d7e2d9;padding-top:14px;margin-top:20px}.side summary{cursor:pointer;font-size:12px;color:#205b48;line-height:1.8}.side .analysis-refresh{font-size:11px;width:auto;margin-top:14px;padding:6px 10px}.reference-card{border-bottom:1px solid #e0e8df;padding:12px 0}.reference-card h3{font-size:13px}.reference-type{font-size:10px;padding:3px 6px;background:#edf3ed;border-radius:4px;color:#5d735f}.side .comparison-note{font-size:11px;color:#97621d}.reference-card a{word-break:break-all}.original-title{font-style:italic;color:#6a7e70}.side dd{white-space:pre-line}
@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:12px}.navigation{display:none}}
@media(max-width:680px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.toolbar{position:static}aside{position:static}}

</style>
<header><h1 id="work-title">曲谱同步导聆</h1><p>本地同步校验 · Sync Toolbox 离线全曲结果 · MIDI 辅助时间轴 + 原始重排 PDF</p></header>
<div class="toolbar"><label>曲目 <select id="track" aria-label="曲目"></select></label><button id="previous">← 前一节</button><button id="next">后一节 →</button><label>小节 <input id="jump" type="number" min="1" value="1"></label><button id="go">跳转</button><audio id="audio" controls preload="metadata"></audio><label>速度 <select id="speed"><option>.6</option><option>.8</option><option selected>1</option><option>1.2</option></select></label></div>
<main class="layout"><aside class="navigation"><h2>小节时间轴</h2><small>· 表示需要重点复核。全部结果均未经人工确认。</small><div class="list" id="list"></div></aside><section><div class="pagebuttons"><button id="pageprev">上一页</button><span id="pagelabel">正在加载项目…</span><label><input type="checkbox" id="follow" checked> 跟随播放翻页</label><label><input type="checkbox" id="showplayhead" checked> 显示播放线</label><span class="playhead-readout" id="playheadlabel" title="根据对齐时间在谱面区域内插值，尚未逐音符校对">小节内估计位置 · 0%</span><button id="pagenext">下一页</button></div><div class="sheet" id="sheet"><img id="score" alt="原始 PDF 页面"><div class="highlight" id="highlight" hidden></div><div class="playhead" id="playhead" hidden aria-hidden="true"></div></div></section><aside class="side">
<div class="now-playing"><h2 id="current">正在载入</h2><span class="status" id="status">算法候选</span></div>
<div class="analysis-tabs" role="tablist" aria-label="导聆资料">
<button id="tab-guide" role="tab" aria-selected="true" aria-controls="panel-guide">当前导聆</button>
<button id="tab-recording" role="tab" aria-selected="false" aria-controls="panel-recording" tabindex="-1">曲目信息</button>
<button id="tab-references" role="tab" aria-selected="false" aria-controls="panel-references" tabindex="-1">参考文献</button>
</div>
<p class="analysis-note" id="analysis-load-state" role="status">正在读取分析文档…</p>
<section id="panel-guide" role="tabpanel" aria-labelledby="tab-guide">
<p id="guide-playing-page" class="guide-playing-page">跟随播放位置</p>
<label class="guide-select-label">导聆段落<select id="guide-section" aria-label="导聆段落"></select></label>
<span id="guide-range" class="guide-range"></span><h3 id="guide-title">正在载入导聆</h3>
<div id="guide-body" class="analysis-rich"></div>
<details class="full-analysis"><summary>阅读完整分析文档</summary><p id="analysis-source-name" class="analysis-note"></p><div id="analysis-full-text" class="analysis-rich"></div></details>
<button id="analysis-refresh" class="analysis-refresh">刷新分析文档</button>
</section>
<section id="panel-recording" role="tabpanel" aria-labelledby="tab-recording" hidden><div id="recording-details"></div></section>
<section id="panel-references" role="tabpanel" aria-labelledby="tab-references" hidden><p id="reference-count" class="analysis-note"></p><p class="analysis-note" id="reference-reading-note">参考资料的阅读状态将在载入后显示。</p><div id="reference-list"></div></section>
<details class="review-tools"><summary>同步信息与人工校正</summary>
<dl><dt>候选时间</dt><dd id="interval"></dd><dt>原谱位置</dt><dd id="location"></dd><dt>当前播放</dt><dd id="clock">0:00</dd></dl>
<div id="notice"></div><h3>校正锚点</h3><small>试听并查看原谱后，将播放停在本节起点。保存的锚点可用于重新对齐。</small>
<input id="reason" placeholder="修改依据，例如已核对独奏进入"><button id="anchor">用当前播放时间设起点</button><button id="undo">撤销最近一次锚点修改</button><button class="primary" id="save">保存人工锚点</button><button id="export">导出当前项目数据</button><p id="toast" role="status"></p>
<p class="muted" id="review-summary">候选同步结果尚未完成人工试听验收。</p>
</details><small>素材与分析在本机读取，参考链接仅在点击时打开。</small>
</aside></main>
<script type="module" src="/app.mjs"></script>
</html>
